<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Phuoc Quy's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fontawesome/css/all.min.css" />
  </head>
  <body>
    <button
      class="theme-toggle"
      type="button"
      aria-label="Enable dark mode"
      title="Enable dark mode"
    >
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>

    <nav class="side-navbar" aria-label="Main navigation">
      <a
        class="nav-brand"
        href="assets/docs/Phuoc-Quy-Resume.pdf"
        download
        aria-label="Download CV"
        title="Download CV"
      >
        CV
      </a>
      <div class="nav-links">
        <a
          href="#hero"
          class="nav-link active"
          aria-label="About"
          aria-current="page"
        >
          <i class="fa-regular fa-id-card" aria-hidden="true"></i>
          <span>About</span>
        </a>
        <a href="#main" class="nav-link" aria-label="Home">
          <i class="fa-regular fa-house" aria-hidden="true"></i>
          <span>Home</span>
        </a>
      </div>
      <div class="nav-line" aria-hidden="true"></div>
      <span class="nav-caption">PORTFOLIO <b>·</b> 2026</span>
    </nav>

    <section id="hero" class="hero">
      <div class="hero-content">
        <div class="hero-profile">
          <div class="avatar-frame">
            <img src="assets/images/avatar.png" alt="Phuoc Quy" />
          </div>
          <h1>Hello, I'm Phuoc Quy</h1>
          <div class="hero-about">
            <p>
              A curious developer focused on creating clean, useful, and human
              centered work.
            </p>
          </div>
        </div>
        <form
          class="contact-form"
          action="https://formsubmit.co/phuocquyforwork@gmail.com"
          method="POST"
        >
          <input type="hidden" name="_subject" value="New portfolio message" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_template" value="table" />
          <input
            type="text"
            name="_honey"
            tabindex="-1"
            autocomplete="off"
            hidden
          />
          <p class="contact-label">Get in touch</p>
          <h2>Let's talk.</h2>
          <label for="contact-name">Name</label>
          <input
            id="contact-name"
            name="name"
            type="text"
            placeholder="Your name"
            required
          />
          <label for="contact-email">Email</label>
          <input
            id="contact-email"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
          />
          <label for="contact-message">Message</label>
          <textarea
            id="contact-message"
            name="message"
            rows="4"
            placeholder="Your message here..."
            required
          ></textarea>
          <button type="submit">
            Send message
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </button>
        </form>
      </div>
      <a
        class="scroll-cue scroll-cue-down"
        href="#main"
        aria-label="Scroll down to main content"
      >
        <span>Home</span>
        <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
      </a>
    </section>

    <section id="main" class="main">
      <a
        class="scroll-cue scroll-cue-up"
        href="#hero"
        aria-label="Scroll up to hero section"
      >
        <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
        <span>About</span>
      </a>
      <footer class="main-footer">
        <i class="fa-regular fa-copyright" aria-hidden="true"></i>
        <span>Copyright Phuoc Quy 2026</span>
      </footer>
    </section>
    <script src="script.js"></script>
  </body>
</html>
